[project]
name = "duckdb-mcp"
version = "0.1.0"
description = "MCP server that lets an AI query local CSV, TSV, Parquet, JSON and NDJSON files with SQL through DuckDB, read-only and confined to the folders you allow."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "duckdb>=2.0.0",
]
keywords = ["mcp", "duckdb", "sql", "csv", "parquet", "json", "data-analysis", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio", "psutil"]

[project.urls]
Homepage = "https://github.com/0xmortuex/duckdb-mcp"

[project.scripts]
duckdb-mcp = "duckdb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
